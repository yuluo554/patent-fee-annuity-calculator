name: CI

on:
  push:
  pull_request:

# 最小权限：CI 只读仓库内容（默认 token 权限过宽，且 job 内不需要写回）
permissions:
  contents: read

# 同一 ref 新推即取消上一跑：省 runner，也避免"旧跑的结论"盖住新跑的结论
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI 的 extras 必须覆盖"全部里程碑门的依赖"（含测试期依赖 pytest/pyyaml），
# 否则门会在 CI 上静默跳过 —— "本地一直绿" ≠ "CI 验过"。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: test py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 解释器底线自 2026-10-19 抬到 3.12（3.10 及更早版本均已 EOL，见 plan/06 D54）：
        # 双平台同版本，四矩阵只剩两格
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 历史扫描类守门依赖 git 历史；浅克隆会让它在 CI 里静默空验
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install package with dev+report extras
        # M6 实测（干净环境逐条跑通 README）：XLSX 报告测试依赖 openpyxl，
        # 只装 .[dev] 会硬失败（不是 skip）—— 测试面必须与安装面对齐。
        run: python -m pip install -e ".[dev,report]"

      - name: Run tests
        run: python -m pytest -q

      - name: Selfcheck
        run: python -m patfee.cli selfcheck

      - name: Benchmark
        run: python -m patfee.cli bench

      - name: Ruleset freeze check
        run: python tools/gen_rulesets.py --check

  core-only:
    name: core-only (no third-party runtime deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install -U pip

      # 证明"核心层零第三方依赖"：不装任何 extra。
      # 但 pytest 本身是测试期依赖 —— 装 core-only 不等于装齐"跑测试所需"，
      # 漏装会让守门测试整批 ImportError（不是 skip）。
      - name: Install core package and test framework only
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Guard tests on core-only environment
        run: python -m pytest -q tests/test_rules_loader.py tests/test_rules_gate.py tests/test_annuity_ladder.py tests/test_benchmark.py

      - name: Selfcheck without optional extras
        run: python -m patfee.cli selfcheck

  packaging-guard:
    name: packaging guard (spec + freeze discipline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install dev+report extras
        # 只装 .[dev] 会让 test_m5_report.py 的 XLSX 断言在缺 openpyxl 下硬失败
        run: python -m pip install -e ".[dev,report]"

      - name: Frozen ruleset byte-identity check
        run: python tools/gen_rulesets.py --check

      - name: Repo guard tests
        run: python -m pytest -q tests/test_repo_guards.py
